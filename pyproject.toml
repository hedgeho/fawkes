[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fawkes"
dynamic = ["version"]
description = "Image cloaking against automated face recognition"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ilia Zalesskii", email = "code@ilia.fi"}, { name = "Shawn Shan", email = "shawnshan@cs.uchicago.edu" }]
keywords = ["fawkes", "privacy", "ML"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.4"]
# torch lives in one of these two extras so a CPU box never downloads the CUDA libraries:
# `uv sync --extra cpu` without a GPU, `uv sync --extra cu128` with CUDA (pip users: pip install '.[cpu]')
cpu = ["torch>=2.4"]
cu128 = ["torch>=2.4"]

[project.urls]
Homepage = "https://github.com/hedgeho/fawkes"

[project.scripts]
fawkes = "fawkes:main"

[tool.setuptools]
packages = ["fawkes", "fawkes.arch"]

[tool.setuptools.dynamic]
version = { attr = "fawkes.__version__" }

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
