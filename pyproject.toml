[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fawkes"
dynamic = ["version"]
description = "An utility to protect user privacy"
readme = "README.md"
license = { text = "BSD" }
authors = [{ name = "Shawn Shan", email = "shawnshan@cs.uchicago.edu" }]
keywords = ["fawkes", "privacy", "ML"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.4",
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.4"]

[project.urls]
Homepage = "https://github.com/Shawn-Shan/fawkes"

[project.scripts]
fawkes = "fawkes:main"

[tool.setuptools]
packages = ["fawkes"]

[tool.setuptools.dynamic]
version = { attr = "fawkes.__version__" }

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
