[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fawkes"
dynamic = ["version"]
description = "An utility to protect user privacy"
readme = "README.md"
license = { text = "BSD" }
authors = [{ name = "Shawn Shan", email = "shawnshan@cs.uchicago.edu" }]
keywords = ["fawkes", "privacy", "ML"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26",
    "tensorflow>=2.16",
    "mtcnn>=1.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Shawn-Shan/fawkes"

[project.scripts]
fawkes = "fawkes:main"

[tool.setuptools]
packages = ["fawkes"]

[tool.setuptools.dynamic]
version = { attr = "fawkes.__version__" }

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
